<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Science Supply Check-In</title>
<style>
:root{
  --ink:#1c2230; --ink-soft:#5a6070; --line:#e2e4ea; --bg:#f6f7f9; --card:#ffffff;
  --accent:#2f6f5e; --accent-dark:#234f43;
  --bio:#2f9e5c; --bio-bg:#e6f6ec;
  --chem:#3b7dd8; --chem-bg:#e8f1fd;
  --earth:#b3860f; --earth-bg:#fdf6df;
  --phys:#7c5cbf; --phys-bg:#f1ecfa;
  --forensics:#c1584a; --forensics-bg:#fbe9e6;
  --multi:#2f7a7a; --multi-bg:#e3f2f2;
  --unspec:#767676; --unspec-bg:#ececec;
  --green:#2f9e5c; --green-bg:#e6f6ec;
  --amber:#c9860f; --amber-bg:#fdf1de;
  --red:#c0392b; --red-bg:#fbe9e7;
  --gray:#8a8f9c; --gray-bg:#eef0f3;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;}
.app{max-width:760px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:40px;}
.topbar{position:sticky;top:0;z-index:20;background:var(--accent-dark);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.15);}
.topbar .back{background:rgba(255,255,255,.15);border:none;color:#fff;width:34px;height:34px;border-radius:9px;font-size:18px;cursor:pointer;flex-shrink:0;}
.topbar .title{font-size:16px;font-weight:700;flex:1;line-height:1.25;min-width:0;}
.topbar .sub{font-size:12px;opacity:.85;font-weight:400;}
.mode-toggle{display:flex;background:rgba(255,255,255,.15);border-radius:9px;padding:2px;flex-shrink:0;}
.mode-toggle button{border:none;background:transparent;color:#fff;font-size:12px;font-weight:600;padding:6px 10px;border-radius:7px;cursor:pointer;opacity:.7;}
.mode-toggle button.active{background:#fff;color:var(--accent-dark);opacity:1;}
.content{padding:16px;}
.hero{padding:6px 4px 18px;}
.hero h1{font-size:21px;margin:0 0 4px;letter-spacing:-.01em;}
.hero p{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.5;}
.search-wrap{margin-bottom:16px;}
.search-input{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);font-size:15px;background:#fff;}
.search-input:focus{outline:none;border-color:var(--accent);}
.search-results{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
.search-hit{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;}
.search-hit:active{background:#f0f1f3;}
.search-hit .h-desc{font-size:14px;font-weight:600;}
.search-hit .h-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.path-cards{display:flex;flex-direction:column;gap:12px;}
.path-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .1s;}
.path-card:active{transform:scale(.98);background:#f0f1f3;}
.path-card .icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;background:var(--accent);color:#fff;}
.path-card .txt h3{margin:0 0 3px;font-size:15.5px;}
.path-card .txt p{margin:0;font-size:13px;color:var(--ink-soft);}
.section-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:22px 0 10px;}
.grid-list{display:flex;flex-direction:column;gap:10px;}
.list-btn{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.list-btn:active{background:#f0f1f3;}
.list-btn .lb-main{font-size:15px;font-weight:600;}
.list-btn .lb-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.list-btn .chev{color:var(--ink-soft);font-size:18px;}
.disc-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.disc-dot{width:8px;height:8px;border-radius:50%;}
.status-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;}
.group-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;margin-bottom:10px;}
.group-card:active{background:#f0f1f3;}
.group-card .gc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;}
.group-card .gc-vendor{font-size:15px;font-weight:700;}
.group-card .gc-meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.group-card .gc-progress{height:6px;border-radius:4px;background:var(--gray-bg);overflow:hidden;margin-top:4px;}
.group-card .gc-progress-fill{height:100%;background:var(--green);}
/* checklist screen */
.rollup-banner{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px;border:1px solid var(--line);}
.rollup-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;}
.rollup-top h2{font-size:16px;margin:0;}
.rollup-meta{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;line-height:1.5;}
.progress-track{height:9px;border-radius:5px;background:var(--gray-bg);overflow:hidden;}
.progress-fill{height:100%;background:var(--green);transition:width .25s;}
.progress-text{font-size:12px;color:var(--ink-soft);margin-top:6px;}
.group-note{background:var(--amber-bg);border:1px solid #f0dca8;color:#7a5a10;font-size:12.5px;border-radius:10px;padding:9px 11px;margin-bottom:14px;line-height:1.5;}
.item-row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px;}
.item-top{display:flex;justify-content:space-between;gap:10px;}
.item-desc{font-size:14.5px;font-weight:600;line-height:1.35;flex:1;}
.item-no{font-size:11.5px;font-weight:600;color:var(--ink-soft);background:var(--gray-bg);border-radius:5px;padding:1px 6px;margin-left:7px;white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
.item-qty{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;padding-top:1px;}
.item-controls{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap;align-items:center;}
.qbtn{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:11px 10px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink-soft);flex:1;min-width:0;text-align:center;line-height:1.25;}
.qbtn.on-full{background:var(--green-bg);border-color:var(--green);color:var(--green);}
.qbtn.on-partial{background:var(--amber-bg);border-color:var(--amber);color:var(--amber);}
.qbtn.on-bo{background:var(--red-bg);border-color:var(--red);color:var(--red);}
.partial-input-wrap{display:flex;align-items:center;gap:6px;margin-top:8px;}
.partial-input-wrap input[type=number]{width:74px;padding:10px 8px;border-radius:8px;border:1.5px solid var(--line);font-size:15px;}
.partial-input-wrap label{font-size:12px;color:var(--ink-soft);}
.note-toggle{font-size:11.5px;color:var(--accent);background:none;border:none;cursor:pointer;padding:4px 0;font-weight:600;}
.note-input{width:100%;margin-top:6px;padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);font-size:13px;font-family:inherit;resize:vertical;}
.saved-check{font-size:11px;color:var(--green);font-weight:700;opacity:0;transition:opacity .3s;}
.saved-check.show{opacity:1;}
.item-row.highlight-target{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,111,94,.18);animation:pulseHighlight 1.6s ease-in-out 2;}
@keyframes pulseHighlight{0%,100%{background:#fff;}50%{background:var(--green-bg);}}
/* admin */
.admin-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px;}
.summary-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;}
.summary-card .num{font-size:22px;font-weight:800;line-height:1.1;}
.summary-card .lbl{font-size:11px;color:var(--ink-soft);margin-top:3px;font-weight:600;}
.filter-row{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px;}
.filter-chip{flex-shrink:0;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink-soft);white-space:nowrap;}
.filter-chip.active{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff;}
.empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:14px;}
.back-link{display:inline-flex;align-items:center;gap:5px;color:var(--accent);background:none;border:none;font-size:13.5px;font-weight:600;cursor:pointer;padding:0 0 14px;}
::-webkit-scrollbar{display:none;}
</style>
</head>

async function fbGet(path){
  const res = await fetch(FIREBASE_DB_URL + path + '.json');
  if(!res.ok) throw new Error('Firebase GET failed: ' + res.status);
  return res.json();
}
async function fbPut(path, data){
  const res = await fetch(FIREBASE_DB_URL + path + '.json', {
    method: 'PUT',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(data)
  });
  if(!res.ok) throw new Error('Firebase PUT failed: ' + res.status);

}

  clearTimeout(saveTimers[groupId]);
  saveTimers[groupId] = setTimeout(async ()=>{
    try{
      await fbPut('/checkin/'+groupId, checkinState[groupId]);
      flashSaved(groupId);
    }catch(e){ console.error('save failed', e); }
  }, 350);
}
function flashSaved(groupId){
  const el = document.getElementById('saved-'+groupId);
  if(el){ el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),900); }
}

// Poll for changes from other devices every few seconds, but never while
// someone is actively typing (so we don't yank focus out from under them).
function startLiveSync(){
  setInterval(async ()=>{
    const active = document.activeElement;
    const isTyping = active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA');
    if(isTyping) return;
    try{
      const all = await fbGet('/checkin');
      let changed = false;
      GROUPS.forEach(g=>{
        const fresh = (all && all[g.id]) ? all[g.id] : {items:{}};
        if(JSON.stringify(fresh) !== JSON.stringify(checkinState[g.id])){
          checkinState[g.id] = fresh;
          changed = true;
        }
      });
      if(changed) render();
    }catch(e){ /* silent - keep using last known state */ }
  }, 4000);
}

function getItemState(groupId, idx){
  const gs = checkinState[groupId] || {items:{}};
  return gs.items[idx] || {received:0, bo:false, note:''};
}
function setItemState(groupId, idx, patch){
  if(!checkinState[groupId]) checkinState[groupId] = {items:{}};
  const cur = getItemState(groupId, idx);
  checkinState[groupId].items[idx] = Object.assign({}, cur, patch);
  scheduleSave(groupId);
}

function itemStatus(groupId, idx, qty){
  const st = getItemState(groupId, idx);
  if(st.bo && st.received < qty) return 'backorder';
  if(st.received >= qty && qty>0) return 'full';
  if(st.received > 0) return 'partial';
  return 'unchecked';
}

function groupProgress(g){
  let full=0, partial=0, bo=0, unchecked=0;
  g.items.forEach((it,idx)=>{
    const s = itemStatus(g.id, idx, it.qty);
    if(s==='full') full++; else if(s==='partial') partial++; else if(s==='backorder') bo++; else unchecked++;
  });
  const total = g.items.length;
  let status = 'waiting';
  if(full===total) status='payable';
  else if(full>0 || partial>0 || bo>0) status='partial';
  if(bo>0 && full<total) status='attention';
  return {full,partial,bo,unchecked,total,status};
}

const STATUS_META = {
  payable:  {label:'Payable',    c:'var(--green)', bg:'var(--green-bg)'},
  partial:  {label:'Partial',    c:'var(--amber)', bg:'var(--amber-bg)'},
  attention:{label:'Back-ordered items', c:'var(--red)', bg:'var(--red-bg)'},
  waiting:  {label:'Not started',c:'var(--gray)',  bg:'var(--gray-bg)'}
};

function renderGroupsFor(kind, value){
  const wrap = document.createElement('div');
  let groupsForX;
  if(kind==='vendor'){
    groupsForX = GROUPS.filter(g=>g.vendor===value);
  } else {
    const dv = currentScreen.discValue;
    groupsForX = GROUPS.filter(g=>g.discipline === (dv===undefined? value : dv));
  }

  const header = document.createElement('div');
  header.style.margin = '22px 0 12px';
  header.innerHTML = `<div class="section-label" style="margin:0 0 10px;">${escapeHtml(value)}</div>
    <input class="search-input" id="vendor-item-search" type="text" placeholder="Search items in ${escapeAttr(value)}... (e.g. beaker, gloves)" value="${escapeHtml(currentScreen.query||'')}">`;
  wrap.appendChild(header);

  const toggleRow = document.createElement('div');
  toggleRow.style.display = 'flex';
  toggleRow.style.justifyContent = 'flex-end';
  toggleRow.style.margin = '10px 0 12px';
  wrap.appendChild(toggleRow);

  const resultsDiv = document.createElement('div');
  resultsDiv.id = 'groupsfor-results';
  wrap.appendChild(resultsDiv);

  function renderToggle(){
    const expanded = !!currentScreen.expanded;
    const q = (currentScreen.query||'').trim();
    if(q.length>0){ toggleRow.innerHTML=''; return; } // searching implies flat view, hide toggle
    toggleRow.innerHTML = `<button class="filter-chip ${expanded?'active':''}" id="expand-toggle">${expanded? '\u2716 Collapse':'\u2295 Expand all'}</button>`;
    toggleRow.querySelector('#expand-toggle').onclick = ()=>{
      currentScreen.expanded = !currentScreen.expanded;
      renderToggle();
      renderResults();
    };
  }

  function renderResults(){
    resultsDiv.innerHTML = '';
    const q = (currentScreen.query||'').trim().toLowerCase();
    const expanded = !!currentScreen.expanded || q.length>0;

    if(!expanded){
      let html = '';
      groupsForX.forEach(g=>{
        const prog = groupProgress(g);
        const meta = STATUS_META[prog.status];
        const st = discStyle(g.discipline);
        html += `<div class="group-card" data-id="${g.id}">
          <div class="gc-top">
            <div>
              <div class="gc-vendor">${escapeHtml(g.vendor)}${g.setLabel? ' \u00b7 '+escapeHtml(g.setLabel):''}</div>
              <div class="gc-meta">${g.po? 'PO '+escapeHtml(g.po) : 'No PO'} ${g.discipline? '\u00b7 <span class="disc-chip" style="background:'+st.bg+';color:'+st.c+'"><span class="disc-dot" style="background:'+st.c+'"></span>'+escapeHtml(g.discipline)+'</span>' : ''}</div>
            </div>
            <span class="status-pill" style="background:${meta.bg};color:${meta.c}">${meta.label}</span>
          </div>
          <div class="gc-progress"><div class="gc-progress-fill" style="width:${prog.total? (prog.full/prog.total*100):0}%"></div></div>
          <div class="gc-meta" style="margin-top:6px;">${prog.full} of ${prog.total} items received in full</div>
        </div>`;
      });
      resultsDiv.innerHTML = html;
      resultsDiv.querySelectorAll('.group-card').forEach(c=>{
        c.onclick = ()=>{
          currentScreen = {name:'checklist', groupId:c.dataset.id, from:{name:'groupsFor', mode:kind, value:value, discValue: currentScreen.discValue, expanded: currentScreen.expanded}};
          render();
        };
      });
      return;
    }

    // expanded (or searching) flat view, grouped under each PO's mini header
    if(q.length>0){
      const hint = document.createElement('div');
      hint.className = 'group-note';
      const matchCount = groupsForX.reduce((a,g)=>a+g.items.filter(it=>matchesQuery(it,q)).length,0);
      hint.textContent = matchCount + ' item' + (matchCount===1?'':'s') + ' match "' + currentScreen.query.trim() + '"';
      resultsDiv.appendChild(hint);
    } else {
      const hint = document.createElement('div');
      hint.className = 'group-note';
      hint.textContent = 'Every PO for ' + value + ' in one list \u2014 find the item, check it in, and put it in the discipline shown.';
      resultsDiv.appendChild(hint);
    }

    let anyMatch = false;
    groupsForX.forEach(g=>{
      const matchingIdxs = [];
      g.items.forEach((it,idx)=>{ if(q.length===0 || matchesQuery(it,q)) matchingIdxs.push(idx); });
      if(matchingIdxs.length===0) return;
      anyMatch = true;
      const section = document.createElement('div');
      section.style.marginTop = '18px';
      const prog = groupProgress(g);
      const meta = STATUS_META[prog.status];
      const st = discStyle(g.discipline);
      const subHeader = document.createElement('div');
      subHeader.className = 'group-card';
      subHeader.style.cursor = 'default';
      subHeader.innerHTML = `<div class="gc-top">
          <div>
            <div class="gc-vendor">${escapeHtml(g.vendor)}${g.setLabel? ' \u00b7 '+escapeHtml(g.setLabel):''}</div>
            <div class="gc-meta">${g.po? 'PO '+escapeHtml(g.po) : 'No PO'} ${g.discipline? '\u00b7 <span class="disc-chip" style="background:'+st.bg+';color:'+st.c+'"><span class="disc-dot" style="background:'+st.c+'"></span>Goes in: '+escapeHtml(g.discipline)+'</span>' : '\u00b7 <span class="disc-chip" style="background:var(--unspec-bg);color:var(--unspec)">Unspecified discipline</span>'}</div>

        </div>

      section.appendChild(subHeader);

      itemsDiv.style.marginTop = '8px';

      });

      resultsDiv.appendChild(section);
    });

      resultsDiv.innerHTML += '<div class="empty-state">No items matched. Try a different word.</div>';
    }
  }

  const searchBox = header.querySelector('#vendor-item-search');
  searchBox.oninput = (e)=>{
    currentScreen.query = e.target.value;
    renderToggle();
    renderResults();
  };

  renderToggle();
  renderResults();
  return wrap;
}

function updateGroupCardInPlace(g, cardEl){
  const prog = groupProgress(g);
  const meta = STATUS_META[prog.status];
  const pill = cardEl.querySelector('.status-pill');
  if(pill){ pill.style.background = meta.bg; pill.style.color = meta.c; pill.textContent = meta.label; }
  const fill = cardEl.querySelector('.gc-progress-fill');
  if(fill){ fill.style.width = (prog.total? (prog.full/prog.total*100):0)+'%'; }
}

function buildItemRow(g, idx, opts){
  opts = opts || {};
  const it = g.items[idx];
  const state = getItemState(g.id, idx);
  const status = itemStatus(g.id, idx, it.qty);
  const row = document.createElement('div');
  row.className = 'item-row';
  row.dataset.idx = idx;
  const rowUid = g.id+'-'+idx;
  row.innerHTML = `
      <div class="item-top">
        <div class="item-desc">${escapeHtml(it.desc)}${itemNoTag(it)}</div>
        <div class="item-qty">${it.qty} ${escapeHtml(it.unit||'')}</div>
      </div>
      <div class="item-controls">
        <button class="qbtn qbtn-full ${status==='full'?'on-full':''}" data-action="full">&#10003; Received all</button>
        <button class="qbtn qbtn-partial ${status==='partial'?'on-partial':''}" data-action="partial">&plusmn; Partial</button>
        <button class="qbtn qbtn-bo ${status==='backorder'?'on-bo':''}" data-action="bo">&#8987; Back-order</button>
      </div>
      <div class="partial-row" style="display:${status==='partial'?'flex':'none'};">
        <div class="partial-input-wrap">
          <label>Qty received:</label>
          <input type="number" min="0" class="partial-input" value="${state.received||0}">
        </div>
      </div>
      <button class="note-toggle" data-action="note-toggle">${state.note? 'Edit note':'+ Add note'}</button>
      <div class="note-wrap" style="display:${state.note? 'block':'none'};">
        <textarea class="note-input" rows="2" placeholder="e.g. box damaged, wrong item substituted...">${escapeHtml(state.note||'')}</textarea>
      </div>
      <span class="saved-check">Saved</span>
  `;
  const fullBtn = row.querySelector('.qbtn-full');
  const partialBtn = row.querySelector('.qbtn-partial');
  const boBtn = row.querySelector('.qbtn-bo');
  const partialRow = row.querySelector('.partial-row');
  const partialInput = row.querySelector('.partial-input');
  const noteToggle = row.querySelector('[data-action="note-toggle"]');
  const noteWrap = row.querySelector('.note-wrap');
  const noteInput = row.querySelector('.note-input');
  const savedFlag = row.querySelector('.saved-check');

  let partialVisible = (itemStatus(g.id, idx, it.qty) === 'partial');

  function refreshButtonHighlights(){
    const s = itemStatus(g.id, idx, it.qty);
    fullBtn.classList.toggle('on-full', s==='full');
    partialBtn.classList.toggle('on-partial', s==='partial');
    boBtn.classList.toggle('on-bo', s==='backorder');
  }
  function setPartialVisible(v){
    partialVisible = v;
    partialRow.style.display = v ? 'flex' : 'none';
  }
  function flashLocal(){
    savedFlag.classList.add('show'); setTimeout(()=>savedFlag.classList.remove('show'), 900);
  }
  function afterChange(){
    refreshButtonHighlights();
    if(opts.onChange) opts.onChange();
    flashLocal();
  }

  fullBtn.onclick = ()=>{
    setItemState(g.id, idx, {received: it.qty, bo:false});
    setPartialVisible(false);
    afterChange();
  };
  partialBtn.onclick = ()=>{
    const cur = getItemState(g.id, idx);
    const hasExistingPartial = cur.received>0 && cur.received<it.qty;
    const startVal = hasExistingPartial ? cur.received : '';
    setItemState(g.id, idx, {received: hasExistingPartial ? cur.received : 0, bo:false});
    partialInput.value = startVal;
    setPartialVisible(true);
    afterChange();
    partialInput.focus();
    partialInput.select();
  };
  boBtn.onclick = ()=>{
    const cur = getItemState(g.id, idx);
    setItemState(g.id, idx, {bo: !cur.bo});
    afterChange();
  };
  partialInput.oninput = ()=>{
    // While the person is actively editing this field, keep it visible no
    // matter what the in-progress number is (even 0 or blank mid-edit) -
    // only the explicit buttons above should show/hide this row.
    const raw = partialInput.value;
    let v = parseFloat(raw);
    if(isNaN(v) || v<0) v=0;
    setItemState(g.id, idx, {received:v});
    afterChange();
  };
  noteToggle.onclick = ()=>{
    const showing = noteWrap.style.display==='block';
    noteWrap.style.display = showing? 'none':'block';
    if(!showing) noteInput.focus();
  };
  noteInput.oninput = ()=>{
    setItemState(g.id, idx, {note: noteInput.value});
    noteToggle.textContent = noteInput.value ? 'Edit note' : '+ Add note';
    flashLocal();
  };
  return row;
}

    </div>
    <div class="rollup-meta">
      ${g.po? '<strong>PO '+escapeHtml(g.po)+'</strong> \u00b7 ' : '<strong>No PO number</strong> \u00b7 '}
      ${g.discipline? '<span class="disc-chip" style="background:'+st.bg+';color:'+st.c+'"><span class="disc-dot" style="background:'+st.c+'"></span>'+escapeHtml(g.discipline)+'</span>' : '<span class="disc-chip" style="background:var(--unspec-bg);color:var(--unspec)">Unspecified discipline</span>'}
      ${g.deliverTo? '<br>Deliver to: '+escapeHtml(g.deliverTo) : ''}
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${prog.total?(prog.full/prog.total*100):0}%"></div></div>
    <div class="progress-text">${prog.full} received in full &middot; ${prog.partial} partial &middot; ${prog.bo} back-ordered &middot; ${prog.unchecked} not checked (of ${prog.total})</div>
  </div>`;

  if(g.groupNote){
    html += `<div class="group-note">${escapeHtml(g.groupNote)}</div>`;
  }

  html += '<div class="items" id="items-container"></div>';
  wrap.innerHTML = html;

  const itemsContainer = wrap.querySelector('#items-container');
  g.items.forEach((it, idx)=>{
    const row = buildItemRow(g, idx, { onChange: ()=>updateBannerInPlace(g, wrap) });
    itemsContainer.appendChild(row);
  });

  if(currentScreen.highlightIdx !== undefined && currentScreen.highlightIdx !== null){
    const targetIdx = currentScreen.highlightIdx;
    setTimeout(()=>{
      const targetRow = wrap.querySelector(`.item-row[data-idx="${targetIdx}"]`);
      if(targetRow){
        targetRow.classList.add('highlight-target');
        targetRow.scrollIntoView({behavior:'smooth', block:'center'});
        setTimeout(()=>targetRow.classList.remove('highlight-target'), 3300);
      }
    }, 80);
    currentScreen.highlightIdx = null; // only highlight once per navigation
  }

  return wrap;
}

function updateBannerInPlace(g, wrap){
  const prog = groupProgress(g);
  const meta = STATUS_META[prog.status];
  const banner = wrap.querySelector('.rollup-banner');
  if(!banner) return;
  const pill = banner.querySelector('.status-pill');
  pill.style.background = meta.bg; pill.style.color = meta.c; pill.textContent = meta.label;
  const fill = banner.querySelector('.progress-fill');
  fill.style.width = (prog.total? (prog.full/prog.total*100):0)+'%';
  const progText = banner.querySelector('.progress-text');
  progText.textContent = `${prog.full} received in full \u00b7 ${prog.partial} partial \u00b7 ${prog.bo} back-ordered \u00b7 ${prog.unchecked} not checked (of ${prog.total})`;
}

// ---------- admin ----------
function renderAdmin(){
  const wrap = document.createElement('div');
  const relevantGroups = GROUPS.filter(g=>g.id!=='imiller-capital');
  const totals = {payable:0, partial:0, attention:0, waiting:0};
  relevantGroups.forEach(g=>{ totals[groupProgress(g).status]++; });

  let html = `<div class="admin-summary">
    <div class="summary-card"><div class="num" style="color:var(--green)">${totals.payable}</div><div class="lbl">Payable</div></div>
    <div class="summary-card"><div class="num" style="color:var(--amber)">${totals.partial}</div><div class="lbl">Partial</div></div>
    <div class="summary-card"><div class="num" style="color:var(--gray)">${totals.waiting}</div><div class="lbl">Not started</div></div>
  </div>`;
  if(totals.attention>0){
    html += `<div class="group-note" style="background:var(--red-bg);border-color:#eec4bd;color:#7a2c20;">${totals.attention} PO group(s) have items flagged back-ordered.</div>`;
  }

  // filters
  const disciplines = [...new Set(GROUPS.map(g=>g.discipline))];
  const order = ['Biology','Chemistry','Earth Science','Physics','Forensics','Applied/PhySci & Forensics','Physics & Forensics', null];
  disciplines.sort((a,b)=>order.indexOf(a)-order.indexOf(b));

  html += '<div class="filter-row" id="filter-disc"><div class="filter-chip ' + (adminFilter.discipline===null?'active':'') + '" data-d="">All disciplines</div>';
  disciplines.forEach(d=>{
    html += `<div class="filter-chip ${adminFilter.discipline===d?'active':''}" data-d="${d===null?'__null__':escapeAttr(d)}">${escapeHtml(discLabel(d))}</div>`;
  });
  html += '</div>';

  html += '<div class="filter-row" id="filter-status"><div class="filter-chip ' + (adminFilter.status===null?'active':'') + '" data-s="">All statuses</div>';
  ['payable','partial','attention','waiting'].forEach(s=>{
    html += `<div class="filter-chip ${adminFilter.status===s?'active':''}" data-s="${s}">${STATUS_META[s].label}</div>`;
  });
  html += '</div>';

  html += '<div id="admin-list"></div>';

  wrap.innerHTML = html;

  wrap.querySelector('#filter-disc').querySelectorAll('.filter-chip').forEach(chip=>{
    chip.onclick = ()=>{
      const v = chip.dataset.d;
      adminFilter.discipline = v===''? null : (v==='__null__'? null : v);
      if(v==='') adminFilter.discipline = null;
      else if(v==='__null__') adminFilter.discipline = '__null__marker__';
      else adminFilter.discipline = v;
      render();
    };
  });
  wrap.querySelector('#filter-status').querySelectorAll('.filter-chip').forEach(chip=>{
    chip.onclick = ()=>{
      const v = chip.dataset.s;
      adminFilter.status = v===''? null : v;
      render();
    };
  });

  renderAdminList(wrap.querySelector('#admin-list'), relevantGroups);

  // capital section
  const capGroup = GROUPS.find(g=>g.id==='imiller-capital');
  if(capGroup){
    const div = document.createElement('div');
    div.innerHTML = `<div class="section-label">Other budget lines (excluded above)</div>`;
    const prog = groupProgress(capGroup);
    const meta = STATUS_META[prog.status];
    div.innerHTML += `<div class="group-card" data-id="${capGroup.id}">
      <div class="gc-top">
        <div><div class="gc-vendor">${escapeHtml(capGroup.vendor)}</div>
        <div class="gc-meta">PO ${escapeHtml(capGroup.po)} \u00b7 ${escapeHtml(capGroup.deliverTo)}</div></div>
        <span class="status-pill" style="background:${meta.bg};color:${meta.c}">${meta.label}</span>
      </div>
    </div>`;
    div.querySelector('.group-card').onclick = ()=>{
      mode='teacher';
      currentScreen = {name:'checklist', groupId:capGroup.id, from:{name:'home'}};
      render();
    };
    wrap.appendChild(div);
  }

  return wrap;
}

function renderAdminList(container, groups){
  let filtered = groups.filter(g=>{
    if(adminFilter.discipline==='__null__marker__' && g.discipline!==null) return false;
    if(adminFilter.discipline && adminFilter.discipline!=='__null__marker__' && g.discipline!==adminFilter.discipline) return false;
    if(adminFilter.status && groupProgress(g).status!==adminFilter.status) return false;
    return true;
  });
  if(filtered.length===0){
    container.innerHTML = '<div class="empty-state">No PO groups match these filters.</div>';
    return;
  }
  let html = '';
  filtered.forEach(g=>{
    const prog = groupProgress(g);
    const meta = STATUS_META[prog.status];
    const st = discStyle(g.discipline);
    const total$ = g.items.reduce((a,it)=>a+it.qty*it.unitCost,0);
    html += `<div class="group-card" data-id="${g.id}">
      <div class="gc-top">
        <div>
          <div class="gc-vendor">${escapeHtml(g.vendor)}${g.setLabel? ' \u00b7 '+escapeHtml(g.setLabel):''}</div>
          <div class="gc-meta">${g.po? 'PO '+escapeHtml(g.po): 'No PO'} \u00b7 $${total$.toFixed(2)} ${g.discipline!==undefined? '\u00b7 <span class="disc-chip" style="background:'+st.bg+';color:'+st.c+'"><span class="disc-dot" style="background:'+st.c+'"></span>'+escapeHtml(discLabel(g.discipline))+'</span>':''}</div>
        </div>
        <span class="status-pill" style="background:${meta.bg};color:${meta.c}">${meta.label}</span>
      </div>
      <div class="gc-progress"><div class="gc-progress-fill" style="width:${prog.total?(prog.full/prog.total*100):0}%;${prog.bo>0?'background:var(--red);':''}"></div></div>
      <div class="gc-meta" style="margin-top:6px;">${prog.full}/${prog.total} received${prog.bo>0? ' \u00b7 '+prog.bo+' back-ordered':''}${prog.partial>0? ' \u00b7 '+prog.partial+' partial':''}</div>
    </div>`;
  });
  container.innerHTML = html;
  container.querySelectorAll('.group-card').forEach(c=>{
    c.onclick = ()=>{
      mode='teacher';
      currentScreen = {name:'checklist', groupId:c.dataset.id, from:{name:'home'}};
      render();
    };
  });
}

function escapeHtml(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(s){ return escapeHtml(s); }
function matchesQuery(it, q){
  if(!q) return true;
  const hay = (it.desc + ' ' + (it.itemNo||'')).toLowerCase();
  return hay.includes(q);
}
function itemNoTag(it){
  return it.itemNo ? `<span class="item-no">${escapeHtml(it.itemNo)}</span>` : '';
}

// ---------- init ----------
(async function init(){
  root.innerHTML = '<div class="content" style="padding-top:60px;text-align:center;color:#8a8f9c;">Loading check-in data...</div>';
  await loadAllState();
  render();
  startLiveSync();
})();
</script>
</body>
</html>
